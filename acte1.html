<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUIA FINAL - PALADÍ DUAL</title>
    
    <!-- Fonts i Llibreries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'title': ['Cinzel', 'serif'], 'body': ['Spectral', 'serif'] },
                    colors: {
                        gold: '#d4af37', panel: '#0a0a0a', border: '#262626',
                        paladin: '#ffd700', laezel: '#ff5555', sh: '#ffffff', gale: '#5c9aff', astarion: '#b57edc',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #d4d4d4; scroll-behavior: smooth; }
        .item-link { font-weight: 700; color: #d4af37; border-bottom: 1px dotted #555; cursor: help; transition: 0.2s; }
        .item-link:hover { color: #fff; border-bottom: 1px solid #fff; }
        
        .tag { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; margin-left: 6px; border: 1px solid; vertical-align: middle; display: inline-block; font-family: sans-serif; letter-spacing: 0.05em; }
        .t-mc { color: #ffd700; border-color: #ffd700; background: rgba(255, 215, 0, 0.15); } 
        .t-lz { color: #ff5555; border-color: #ff5555; background: rgba(255, 85, 85, 0.15); }
        .t-sh { color: #ffffff; border-color: #ffffff; background: rgba(255, 255, 255, 0.15); }
        .t-gl { color: #5c9aff; border-color: #5c9aff; background: rgba(92, 154, 255, 0.15); }
        .t-as { color: #b57edc; border-color: #b57edc; background: rgba(181, 126, 220, 0.15); }

        .step-row { display: flex; align-items: flex-start; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #1a1a1a; }
        .step-num { font-family: 'Cinzel', serif; font-size: 1.5rem; color: #444; margin-right: 1.5rem; min-width: 2rem; text-align: right; line-height: 1; }
        .step-content { flex: 1; font-size: 1.1rem; line-height: 1.6; }
        .step-content strong { color: #f5f5f5; }
        
        h3 { color: #d4af37; font-family: 'Cinzel', serif; font-size: 1.4rem; margin-top: 2.5rem; margin-bottom: 1rem; border-left: 3px solid #d4af37; padding-left: 1rem; }
    </style>
</head>
<body class="font-body antialiased min-h-screen">
    <div id="root"></div>
    <script type="text/babel">

        const Header = () => (
            <header className="py-20 text-center bg-gradient-to-b from-neutral-900 to-black border-b border-border relative">
                <a href="index.html" className="absolute top-8 left-8 text-gold border border-gold/30 px-4 py-2 text-xs font-title uppercase tracking-widest hover:bg-gold hover:text-black transition">← Menú Principal</a>
                <h1 className="text-5xl font-title font-black text-gold tracking-widest uppercase mb-4">Acte 1: Paladí Dual & Companys</h1>
                <p className="text-gray-400 italic max-w-3xl mx-auto">
                    Guia corregida per TodoRPGS: Paladí (Dual Wielder Lathander/Phalar), Lae'zel (Thrower), Shadowheart (Light Staff), Gale (Magic Missile), Astarion (Crit/Bane).
                </p>
            </header>
        );

        const Item = ({ name, char }) => {
            let tag = null;
            if (char === 'mc') tag = <span className="tag t-mc">PALADÍ</span>;
            if (char === 'laezel') tag = <span className="tag t-lz">LAE'ZEL</span>;
            if (char === 'sh') tag = <span className="tag t-sh">SHADOW</span>;
            if (char === 'gale') tag = <span className="tag t-gl">GALE</span>;
            if (char === 'astarion') tag = <span className="tag t-as">ASTARION</span>;
            return <span><span className="item-link">{name}</span>{tag}</span>;
        };

        const Warning = ({ children }) => (
            <div className="my-6 border-l-4 border-red-700 bg-red-900/10 p-4 rounded-r">
                <div className="flex items-start gap-3">
                    <span className="text-2xl">⚠️</span>
                    <div className="text-red-200 italic">{children}</div>
                </div>
            </div>
        );

        const Tip = ({ children }) => (
            <div className="my-6 border-l-4 border-emerald-700 bg-emerald-900/10 p-4 rounded-r">
                <div className="flex items-start gap-3">
                    <span className="text-2xl">💡</span>
                    <div className="text-emerald-200 italic">{children}</div>
                </div>
            </div>
        );

        const Step = ({ n, children }) => (
            <div className="step-row">
                <div className="step-num">{n}</div>
                <div className="step-content">{children}</div>
            </div>
        );

        const Phase = ({ title, children }) => (
            <section className="mb-24 max-w-4xl mx-auto px-6">
                <div className="sticky top-0 bg-black/95 z-20 py-4 border-b border-border mb-8">
                    <h2 className="text-3xl font-title text-white">{title}</h2>
                </div>
                {children}
            </section>
        );

        const App = () => (
            <div className="pb-40 fade-in">
                <Header />
                <main className="mt-16">

                    {/* FASE 0 */}
                    <Phase title="FASE 0: Setup i L'Arma Final de Lae'zel">
                        <Tip>
                            <strong>Objectiu:</strong> Aconseguir l'espadó llegendari per a Lae'zel a nivell 2-3 sense lluitar.
                        </Tip>
                        
                        <h3>Pas 1: El Mercenari Suïcida</h3>
                        <Step n="1">
                            Ves al campament. Parla amb <strong>Mustio</strong>. Contracta un mercenari (Clérigo).
                        </Step>
                        <Step n="2">
                            A la pujada de nivell, selecciona <Item name="Orden Imperiosa" /> (Command).
                        </Step>
                        <Step n="3">
                            Aconsegueix <strong>Invisibilitat</strong>: Compra una poció a la Tía Ethel (Arboleda) o fes que Gale aprengui l'encanteri.
                        </Step>

                        <h3>Pas 2: Waukeen's Rest</h3>
                        <Step n="4">
                            Surt de l'Arboleda. Viatja a l'Oest, passa l'Aldea Marchita, fins al pont de fusta del nord-oest. Veuràs un drac.
                        </Step>
                        <Warning>
                            <strong>ATURA'T:</strong> No entris al "Paso de la Montaña". Queda't al pont o els Tieflings moriran.
                        </Warning>
                        <Step n="5">
                            Separa el grup. Agafa <strong>NOMÉS AL MERCENARI</strong>.
                        </Step>
                        <Step n="6">
                            Fes-te invisible. Activa el <strong>Modo por Turnos</strong>. Posa't al costat de <strong>Kith'rak Voss</strong> (el genet).
                        </Step>
                        <Step n="7">
                            <strong>GUARDA PARTIDA (F5).</strong>
                        </Step>
                        <Step n="8">
                            Llança <strong>Orden Imperiosa: Soltar</strong>. Si encertes (10-15%), l'espasa cau a terra.
                        </Step>
                        <Step n="9">
                            Recull l'<Item name="Espada de Plata del Plano Astral" char="laezel" />. Deixa que matin el mercenari.
                        </Step>
                        <Step n="10">
                            Reviu-lo al campament i passa l'espasa a Lae'zel. Aquesta és la seva arma final.
                        </Step>
                    </Phase>

                    {/* FASE 1 */}
                    <Phase title="FASE 1: Arboleda (Configuració i Suport)">
                        <h3>Configuració de Classes (Mustio)</h3>
                        <Step n="1">
                            <strong>Tu (Paladí):</strong> A nivell 4, hauràs d'agafar la dote <strong>Combatiente con dos armas</strong> (Dual Wielder) per portar 2 armes versàtils (Lathander + Phalar Aluve).
                        </Step>
                        <Step n="2">
                            <strong>Shadowheart:</strong> Canvia a <span className="text-gray-100">Clérigo (Dominio de la Luz)</span>. Stats: SAB 16+, CON 14, DES 14.
                        </Step>
                        <Step n="3">
                            <strong>Lae'zel:</strong> A nivell 3, <span className="text-gray-100">Guerrero (Caballero Arcano)</span>. Encanteris: Escudo, Salto mejorado.
                        </Step>
                        <Step n="4">
                            <strong>Gale:</strong> A nivell 2, <span className="text-gray-100">Mago (Evocación)</span>.
                        </Step>
                        <Step n="5">
                            <strong>Astarion:</strong> A nivell 3, <span className="text-gray-100">Pícaro (Embaucador Arcano)</span>.
                        </Step>

                        <h3>Compres Obligatòries</h3>
                        <Step n="6">
                            <strong>Arron (Venedor Gnom):</strong> Compra l'<Item name="Anillo de Lanzamiento" char="laezel" /> (Ring of Flinging).
                            <br/><em>Build Lae'zel:</em> +1d4 de dany quan llança la pica.
                        </Step>
                        <Step n="7">
                            <strong>Volo (Bard):</strong> Parla amb ell. Prem el botó "Comerciar" (baix esquerra) abans que marxi. Compra l'<Item name="Anillo del Amor" char="sh" /> (Whispering Promise).
                            <br/><em>Build Shadow:</em> Quan cures, dones +1d4 d'atac a l'aliat.
                        </Step>
                        <Step n="8">
                            <strong>Zevlor:</strong> Parla amb ell i comercia. Compra els <Item name="Guantes del Hellrider" char="sh" />.
                            <br/><em>Build Shadow:</em> Quan cures, dones resistència física.
                        </Step>
                        <Step n="9">
                            <strong>Dammon:</strong> Compra l'<Item name="Arco de Caza" char="laezel" /> (Avantatge contra monstres).
                        </Step>

                        <h3>Dieta de Gale</h3>
                        <Step n="10">
                            Dona-li aquests 3 items brossa quan tingui gana:
                            <br/>1. <Item name="Colgante de Komira" /> (Regal pares Arabella).
                            <br/>2. <Item name="Anillo de Rociada de Color" /> (Niu Arpías, Platja).
                            <br/>3. <Item name="Guía del Vigilante" /> (Cripta Mustio, sarcòfag).
                        </Step>
                    </Phase>

                    {/* FASE 2 */}
                    <Phase title="FASE 2: Wilderness (Armes a Distància i Màgia)">
                        <h3>Aldea Marchita</h3>
                        <Step n="1">
                            Casa dels Ogres. Mata a l'Ogre llest. Agafa la <Item name="Diadema de Intelecto" char="laezel" />.
                            <br/><em>Build EK:</em> Fixa la INT a 17. Ara pots fer respec a Lae'zel, posar-li 8 d'INT base i pujar-li la Força i Constitució al màxim.
                        </Step>
                        <Step n="2">
                            Soterrani Apotecari. Troba el llibre "Nigromancia de Thay". Dona-li a <strong>Astarion</strong>.
                        </Step>
                        <Step n="3">
                            Pou de l'Aldea. Baixa a les coves d'aranyes. Troba les <Item name="Botas de Paso de Araña" /> (Bones per Astarion o Minthara després).
                        </Step>

                        <h3>Waukeen's Rest (Gale)</h3>
                        <Step n="4">
                            Edifici en flames. Salva la Consellera Florrick. Tria: <Item name="La Chispa de los Conjuros" char="gale" /> (Spellsparkler).
                            <br/><em>Build Evo:</em> Aquest bastó és el nucli de la build. Dona "Cargas de Rayo".
                        </Step>

                        <h3>Zhentarim (Astarion & Paladí)</h3>
                        <Step n="5">
                            Cova Gnoll. Salva a Rugan. Queda't el <strong>Cofre Tancat</strong>.
                        </Step>
                        <Step n="6">
                            Soterrani secret a Waukeen's Rest (Zhentarim). Dona-li el cofre a Zarys.
                        </Step>
                        <Step n="7">
                            Compra a Brem:
                            <br/>- <Item name="Harold" char="astarion" />: Ballesta pesada que aplica Bane.
                            <br/>- <Item name="Arco Titanstring" char="mc" />: Arc que suma FOR al dany. La millor arma a distància pel Paladí.
                        </Step>
                        <Step n="8">
                            Mata a tothom. Agafa el <Item name="Frasco de Hierro" /> del cofre de Zarys.
                        </Step>
                        <Step n="9">
                            Mata als Paladins de Tyr (Peaje). Agafa l'<Item name="Espada de la Justicia" char="mc" /> (Usa-la fins a tenir la Lathander).
                        </Step>
                    </Phase>

                    {/* FASE 3 */}
                    <Phase title="FASE 3: El Pantà i l'Anell del Paladí">
                        <Step n="1">
                            Pantà (Sud). Illa sud-est. Llegeix la <strong>Carta de Kagha</strong> a l'arbre buit.
                        </Step>
                        <Step n="2">
                            Torna a l'Arboleda. Desemmascara i mata a Kagha.
                            <br/>Agafa <Item name="Venganza de la Madre de la Camada" char="laezel" /> (Collar).
                            <br/><strong>Efecte:</strong> Ritual aturat. Tieflings salvats.
                        </Step>
                        <Step n="3">
                            <strong>Robatori:</strong> Usa Astarion + Nube de Oscurecimiento. Roba l'Ídol de Silvanus. Fuig al campament.
                        </Step>
                        <Step n="4">
                            Entrega l'ídol a la Mol. Recompensa: <Item name="Anillo de Protección" char="mc" /> (+1 CA).
                        </Step>
                    </Phase>

                    {/* FASE 4 */}
                    <Phase title="FASE 4: PUSH a Nivell 5 (Underdark)">
                        <Tip>
                            Necessites ser Nivell 5 abans d'atacar els Goblins.
                        </Tip>
                        <Step n="1">
                            Entra al Temple Goblin pacíficament. Compra al venedor Grat (Pati): <Item name="Pica de Regreso" char="laezel" /> (Returning Pike).
                            <br/><em>Build EK:</em> OBLIGATORI. És una llança que torna a la mà automàticament. Lae'zel la llançarà constantment.
                        </Step>
                        <Step n="2">
                            Mata a la Sacerdotisa Tripas a la seva habitació (sigil). Baixa a l'Underdark pel seu temple.
                        </Step>
                        <Step n="3">
                            Fort Selunita: Surt per la porta OEST. Agafa l'espasa <Item name="Phalar Aluve" char="mc" /> de la pedra.
                            <br/><em>Build Paladí Dual:</em> Aquesta serà la teva arma a la mà esquerra (Off-hand) quan tinguis la dote "Dual Wielder". La seva habilitat "Cantar" és brutal.
                        </Step>
                        <Step n="4">
                            Fort Selunita: Cofre secret a dalt a la dreta. <Item name="Armadura Luminosa" char="mc" /> (Luminous Armour).
                            <br/><em>Build Radiant:</em> La teva armadura final de l'Acte 1.
                        </Step>
                        <Step n="5">
                            <strong>Colònia Micònids:</strong> Parla amb Blurg. Compra <Item name="Colgante de Disparo Psíquico" char="gale" />.
                            <br/><em>Build Evo:</em> Afegeix 1 míssil a Magic Missile.
                        </Step>
                        <Step n="6">
                            <strong>Zona "Bibberbang" (Nord-oest):</strong> Salva al nan Baelen (o deixa'l morir però agafa la seva bossa). Dona-li el bolet a la seva dona Derryth. Recompensa (o compra-li): <Item name="Guantes de Kushigo" char="laezel" /> (+1d4 dany de llançament).
                        </Step>
                        <Step n="7">
                            <strong>Torre Arcana:</strong> Soterrani. Agafa <Item name="Bastón de Bendición Arcana" char="sh" />.
                            <br/><em>Build Shadow:</em> El millor bastó per a ella. Millora molt l'encanteri "Bendición".
                        </Step>
                    </Phase>

                    {/* FASE 5 */}
                    <Phase title="FASE 5: Massacre Goblin">
                        <Step n="1">
                            Torna al Temple Goblin (Nivell 5).
                        </Step>
                        <Step n="2">
                            Compra l'<Item name="Arco de la Banshee" /> a Roah Moonglow abans de matar-la.
                        </Step>
                        <Step n="3">
                            Aconsegueix el buff <Item name="Amor de Loviatar" char="mc" /> amb l'Abdirak.
                        </Step>
                        <Step n="4">
                            Mata a Minthara. Agafa l'<Item name="Armadura de Araña" char="astarion" /> (Avantatge CON).
                        </Step>
                        <Step n="5">
                            Mata a Ragzlin. Allibera a Halsin.
                        </Step>
                    </Phase>

                    {/* FASE 6 */}
                    <Phase title="FASE 6: Grymforge (La Forja)">
                        <Step n="1">
                            Viatja a Grymforge (barca).
                        </Step>
                        <Step n="2">
                            Troba Motlles (Escut i Splint/Tablillas). Troba els 2 minerals de Mitral.
                        </Step>
                        <Step n="3">
                            Zona de trampes (passarel·la metàl·lica): Cofre amb <Item name="Protector de los Chispazos" char="gale" /> (Roba elèctrica).
                        </Step>
                        <Step n="4">
                            Mata a Grym.
                        </Step>
                        <Step n="5">
                            Forja <Item name="Armadura de Adamantina" char="laezel" /> (Pesada).
                        </Step>
                        <Step n="6">
                            Forja <Item name="Escudo de Adamantina" char="sh" />.
                        </Step>
                        <Step n="7">
                            Agafa el <Item name="Yelmo de Cráneo de Grym" char="laezel" /> del boss (Immune a crítics, dóna marca del caçador).
                        </Step>
                    </Phase>

                    {/* FASE 7 */}
                    <Phase title="FASE 7: Monestir (Final Acte 1)">
                        <Step n="1">
                            Ves al Creche Y'llek (Pas de la Muntanya).
                        </Step>
                        <Step n="2">
                            Venedora A'jak'nir Jeera:
                            <br/>- Compra <Item name="Guantes de Destreza" char="astarion" /> (DES 18).
                            <br/>- Compra <Item name="Cuchillo del Rey de la Montaña" char="astarion" />.
                        </Step>
                        <Step n="3">
                            Sala de l'Inquisidor. Mata'l.
                            <br/>- Agafa <Item name="Diadema de Sinergia Arcana" char="laezel" /> (si prefereixes aquesta al casc de Grym, suma INT al dany).
                            <br/>- Busca als cofres els <Item name="Guantes de los Cielos Beligerantes" char="mc" /> (Reverberación radiant).
                            <br/>- Agafa l'<Item name="Anillo de Conducto Extraño" char="mc" /> (Strange Conduit Ring). Afegeix 1d4 Psíquic si et concentres.
                        </Step>
                        <Step n="4">
                            Sala Secreta. Aconsegueix la <Item name="Sangre de Lathander" char="mc" />.
                        </Step>
                    </Phase>

                    {/* RESUM INVENTARI */}
                    <section className="bg-neutral-900 border-t border-border mt-20 py-10 px-6 rounded-lg">
                        <h2 className="text-3xl font-title text-gold text-center mb-10">INVENTARI FINAL PER PERSONATGE</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            
                            <div className="border border-paladin/40 p-4 bg-black/40 rounded">
                                <h3 className="text-paladin font-bold mb-3 border-b border-paladin/20 pb-2">TU (Paladí Dual)</h3>
                                <ul className="text-sm text-gray-400 space-y-2">
                                    <li>⚔️ <strong>Mà Dreta:</strong> Sangre de Lathander</li>
                                    <li>⚔️ <strong>Mà Esquerra:</strong> Phalar Aluve</li>
                                    <li>🛡️ <strong>Cos:</strong> Armadura Luminosa</li>
                                    <li>🧤 <strong>Mans:</strong> Guantes Cielos Beligerantes</li>
                                    <li>💍 <strong>Anell:</strong> Anillo de Protección</li>
                                    <li>💍 <strong>Anell:</strong> Anillo Conducto Extraño</li>
                                    <li>🏹 <strong>Dist:</strong> Arco Titanstring</li>
                                    <li>👑 <strong>Cap:</strong> Casco de Haste (Aldea)</li>
                                </ul>
                            </div>

                            <div className="border border-laezel/40 p-4 bg-black/40 rounded">
                                <h3 className="text-laezel font-bold mb-3 border-b border-laezel/20 pb-2">LAE'ZEL (Thrower EK)</h3>
                                <ul className="text-sm text-gray-400 space-y-2">
                                    <li>🔱 <strong>Arma (Llançar):</strong> Pica de Regreso</li>
                                    <li>⚔️ <strong>Melee:</strong> Espada de Plata Astral</li>
                                    <li>🛡️ <strong>Cos:</strong> Armadura Adamantina</li>
                                    <li>👑 <strong>Cap:</strong> Diadema de Intelecto</li>
                                    <li>🧤 <strong>Mans:</strong> Guantes de Kushigo</li>
                                    <li>💍 <strong>Anell:</strong> Anillo de Lanzamiento</li>
                                    <li>📿 <strong>Coll:</strong> Venganza de la Madre</li>
                                </ul>
                            </div>

                            <div className="border border-sh/40 p-4 bg-black/40 rounded">
                                <h3 className="text-sh font-bold mb-3 border-b border-sh/20 pb-2">SHADOWHEART (Light)</h3>
                                <ul className="text-sm text-gray-400 space-y-2">
                                    <li>🪄 <strong>Arma:</strong> Bastón Bendición Arcana</li>
                                    <li>🛡️ <strong>Escut:</strong> Escudo Adamantina</li>
                                    <li>🧤 <strong>Mans:</strong> Guantes del Hellrider</li>
                                    <li>💍 <strong>Anell:</strong> Anillo del Amor</li>
                                    <li>👢 <strong>Peus:</strong> Botas de Ayuda y Consuelo</li>
                                </ul>
                            </div>

                            <div className="border border-gale/40 p-4 bg-black/40 rounded">
                                <h3 className="text-gale font-bold mb-3 border-b border-gale/20 pb-2">GALE (Evocación)</h3>
                                <ul className="text-sm text-gray-400 space-y-2">
                                    <li>🪄 <strong>Arma:</strong> Chispa de los Conjuros</li>
                                    <li>📿 <strong>Coll:</strong> Colgante Disparo Psíquico</li>
                                    <li>👗 <strong>Cos:</strong> Protector de los Chispazos</li>
                                </ul>
                            </div>

                            <div className="border border-astarion/40 p-4 bg-black/40 rounded">
                                <h3 className="text-astarion font-bold mb-3 border-b border-astarion/20 pb-2">ASTARION (Trickster)</h3>
                                <ul className="text-sm text-gray-400 space-y-2">
                                    <li>🏹 <strong>Dist:</strong> Ballesta Harold</li>
                                    <li>⚔️ <strong>Melee:</strong> Cuchillo Rey de la Montaña</li>
                                    <li>🧤 <strong>Mans:</strong> Guantes de Destreza</li>
                                    <li>👗 <strong>Cos:</strong> Armadura de Araña</li>
                                    <li>💍 <strong>Anell:</strong> Anillo Cáustico</li>
                                </ul>
                            </div>

                        </div>
                    </section>

                </main>
                <footer className="text-center mt-20 pt-10 border-t border-border text-gray-600 text-xs uppercase tracking-widest pb-10">
                    Guia Acte 1 Completada - TodoRPGS Edition
                </footer>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
